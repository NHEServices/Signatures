
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NHE Services | Review Document</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      background: #f3f6fa;
      color: #193047;
      font-family: Arial, sans-serif;
    }
    .card {
      max-width: 850px;
      margin: 30px auto;
      padding: 24px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 3px 12px #00000012;
    }
    h1 { color: #142d43; }
    .muted { color: #647588; }
    .notice {
      padding: 14px;
      background: #fff4dd;
      border-radius: 8px;
      margin-top: 16px;
    }
    iframe {
      width: 100%;
      height: 650px;
      border: 1px solid #d8e0e7;
      border-radius: 8px;
    }
    @media(max-width: 600px) {
      .card { padding: 14px; }
      iframe { height: 500px; }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>NHE Services</h1>
    <h2>Review Your Document</h2>
    <p id="status" class="muted">Checking your secure signing link...</p>

    <div id="documentArea" hidden>
      <p><strong>Customer:</strong> <span id="customerName"></span></p>
      <p><strong>Document:</strong> <span id="formName"></span></p>
      <iframe id="pdfViewer" title="NHE document for review"></iframe>
      <div class="notice">
        Electronic signing is being configured.
        You can review the document, but signing is not available yet.
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script>
    let previewUrl = null;

    async function buildFilledPdf(formType, details) {
      if (!window.PDFLib) throw new Error('PDF viewer library did not load. Please refresh.');
      const templatePath = formType === 'auth'
        ? '/nhe-work-authorization.pdf' : '/nhe-job-completion.pdf';
      const templateResponse = await fetch(templatePath, { cache: 'no-store' });
      if (!templateResponse.ok) throw new Error('Unable to load the original NHE form.');

      const pdf = await PDFLib.PDFDocument.load(await templateResponse.arrayBuffer());
      if (pdf.getPageCount() !== 1) throw new Error('Unexpected NHE form layout.');
      const page = pdf.getPage(0);
      const font = await pdf.embedFont(PDFLib.StandardFonts.Helvetica);
      const color = PDFLib.rgb(0.04, 0.08, 0.12);
      const height = page.getHeight();
      const data = details || {};
      const write = (value, x, top, maxWidth, fontSize = 10) => {
        const text = String(value ?? '').trim().replace(/[\r\n\t]+/g, ' ');
        if (!text) return;
        // Helvetica cannot represent every Unicode character; replace unsupported
        // characters without allowing the entire preview to fail.
        const safe = [...text].map(ch => {
          try { font.encodeText(ch); return ch; } catch { return '?'; }
        }).join('');
        let size = fontSize;
        while (size > 6 && font.widthOfTextAtSize(safe, size) > maxWidth) size -= 0.25;
        // Do not let long input spill over into neighboring printed fields.
        let fitted = safe;
        while (fitted && font.widthOfTextAtSize(fitted, size) > maxWidth) fitted = fitted.slice(0, -1);
        if (fitted) page.drawText(fitted, { x, y: height - top, size, font, color });
      };

      if (formType === 'auth') {
        const lossDate = String(data.loss || '');
        const dateParts = lossDate.split('-');
        const formattedLoss = dateParts.length === 3
          ? dateParts[1] + '/' + dateParts[2] + '/' + dateParts[0] : lossDate;
        // Same positions used by the existing employee-side PDF generator.
        write(data.claim, 83, 247, 162);
        write(formattedLoss, 347, 247, 155);
        write([data.address, data.city].filter(Boolean).join(', '), 121, 355, 390);
        write(data.insurer, 39, 439, 410);
      } else {
        write(data.customer, 123, 249, 392);
        write(data.address, 137, 265, 375);
        const location = String(data.city || '').trim();
        const parts = location.split(',').map(x => x.trim());
        const city = parts.length > 1 ? parts[0] : location;
        const region = parts.length > 1 ? parts.slice(1).join(',').trim() : '';
        const regionMatch = region.match(/^([A-Za-z]{2}|[A-Za-z ]+?)\s+(\d{5}(?:-\d{4})?)$/);
        write(city, 112, 279, 125, 9);
        if (regionMatch) {
          write(regionMatch[1], 310, 279, 42, 9);
          write(regionMatch[2], 409, 279, 95, 9);
        } else if (region) {
          write(region, 310, 279, 194, 9);
        }
        write(data.insurer, 200, 298, 305);
        write(data.claim, 135, 314, 370);
      }
      return new Blob([await pdf.save()], { type: 'application/pdf' });
    }

    async function loadDocument() {
      const status = document.getElementById('status');
      const token = new URLSearchParams(window.location.search).get('token');
      if (!token || !/^[0-9a-f]{64}$/i.test(token)) {
        status.textContent = 'This signing link is invalid or missing.';
        return;
      }
      try {
        const response = await fetch('/api/get-signature-request', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          cache: 'no-store',
          body: JSON.stringify({ token })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'Unable to load document.');
        if (!['auth', 'completion'].includes(result.formType)) {
          throw new Error('Unknown document type.');
        }
        const data = result.documentData || {};
        document.getElementById('customerName').textContent = result.customerName || 'Customer';
        document.getElementById('formName').textContent = result.formType === 'auth'
          ? 'Work Authorization and Assignment of Claim' : 'Job Completion Form';
        status.textContent = 'Preparing your document with the job information…';
        const blob = await buildFilledPdf(result.formType, data);
        previewUrl = URL.createObjectURL(blob);
        document.getElementById('pdfViewer').src = previewUrl;
        document.getElementById('documentArea').hidden = false;
        status.textContent = 'Your document is ready for review.';
      } catch (error) {
        status.textContent = error.message || 'Unable to connect. Please try again later.';
      }
    }

    window.addEventListener('pagehide', () => {
      if (previewUrl) URL.revokeObjectURL(previewUrl);
    });

    loadDocument();
  </script>
</body>
</html>
